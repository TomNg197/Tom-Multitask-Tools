<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Tom Multitask</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="side" aria-label="Hồ sơ">
  <div id="profs" role="list"></div>
  <button class="sideBtn add" id="addProf" title="Thêm hồ sơ" aria-label="Thêm hồ sơ">+</button>
  <div class="grow"></div>
  <button class="sideBtn" id="feedBtn" title="Tin mới (tất cả hồ sơ)" aria-label="Tin mới">🔔<span class="cnt hidden" id="feedCnt"></span></button>
  <button class="sideBtn" id="setBtn" title="Cài đặt" aria-label="Cài đặt">⚙️<span class="cnt dot hidden" id="updDot" title="Có bản cập nhật">↑</span></button>
</nav>
<aside id="tabcol" class="hidden" aria-label="Tab của hồ sơ">
  <div class="tcHead"><div class="tcAva" id="tcAva" role="img"></div></div>
  <div class="vtabs" id="tabs" role="tablist" aria-orientation="vertical" aria-label="Tab">
    <button role="tab" data-tab="slack" title="Slack" aria-label="Slack"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9.5" y="1.5" width="3.6" height="9.5" rx="1.8" fill="#36C5F0"/><rect x="1.5" y="10.9" width="9.5" height="3.6" rx="1.8" fill="#2EB67D"/><rect x="10.9" y="13" width="3.6" height="9.5" rx="1.8" fill="#ECB22E"/><rect x="13" y="9.5" width="9.5" height="3.6" rx="1.8" fill="#E01E5A"/><circle cx="5.3" cy="9.1" r="1.8" fill="#2EB67D"/><circle cx="14.9" cy="5.3" r="1.8" fill="#36C5F0"/><circle cx="18.7" cy="14.9" r="1.8" fill="#E01E5A"/><circle cx="9.1" cy="18.7" r="1.8" fill="#ECB22E"/></svg></span></button>
    <button role="tab" data-tab="google" title="Drive / Gmail" aria-label="Drive / Gmail"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 3h7.6l7 12.1h-7.6z" fill="#FFBA00"/><path d="M1.2 15.1L5 21.7l7-12.1L8.2 3z" fill="#00AC47"/><path d="M5 21.7h14l3.8-6.6H8.8z" fill="#2684FC"/><path d="M8.2 3l3.8 6.6" stroke="#0066DA" stroke-width=".01"/></svg></span></button>
    <button role="tab" data-tab="trello" title="Trello" aria-label="Trello"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="4.5" fill="#0C66E4"/><rect x="5" y="5" width="5.6" height="12.8" rx="1.4" fill="#fff"/><rect x="13.4" y="5" width="5.6" height="8" rx="1.4" fill="#fff"/></svg></span></button>
    <button role="tab" data-tab="git" title="Git" aria-label="Git"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.1 10.9L13.1.9a1.6 1.6 0 0 0-2.2 0L8.8 3l2.7 2.7a1.9 1.9 0 0 1 2.4 2.4l2.6 2.6a1.9 1.9 0 1 1-1.1 1.1l-2.4-2.4v6.3a1.9 1.9 0 1 1-1.6-.1V9.2a1.9 1.9 0 0 1-1-2.5L7.7 4 .9 10.9a1.6 1.6 0 0 0 0 2.2l10 10a1.6 1.6 0 0 0 2.2 0l10-10a1.6 1.6 0 0 0 0-2.2z" fill="#F05133"/></svg></span></button>
  </div>
  <div class="grow"></div>
  <button class="tcEdit" id="editProf" title="Sửa hồ sơ" aria-label="Sửa hồ sơ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke="currentColor" stroke-width="1.8"/></svg></button>
</aside>
<header id="top">
  <div id="pname" class="pname">Tom Multitask</div>
  <div class="grow"></div>
  <div class="navs" id="navs">
    <button data-nav="back" title="Quay lại" aria-label="Quay lại">←</button>
    <button data-nav="reload" title="Tải lại" aria-label="Tải lại">⟳</button>
    <button data-nav="home" title="Trang chủ" aria-label="Trang chủ">⌂</button>
    <button data-nav="external" title="Mở bằng trình duyệt" aria-label="Mở bằng trình duyệt">↗</button>
  </div>
</header>
<main id="main">
  <section id="pWeb" class="panel"><div class="loading" id="webHint">Đang tải…</div></section>
  <section id="pGit" class="panel hidden"></section>
  <section id="pFeed" class="panel hidden"></section>
  <section id="pSet" class="panel hidden"></section>
  <section id="pEmpty" class="panel hidden">
    <div class="empty">
      <img class="brandLogo" src="logo.svg" alt="" width="112" height="112">
      <h1>Chào sếp 👋</h1>
      <p>Mỗi <b>hồ sơ</b> = 1 tài khoản Slack + Drive/Gmail + Trello của nó + các nick Git gắn kèm.</p>
      <button class="pri big" id="emptyAdd">+ Tạo hồ sơ đầu tiên</button>
    </div>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
