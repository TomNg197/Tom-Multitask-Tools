name: Build & Release Tom Multitask (MetaTools)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# In-app update (see TIEN_DO.md "Cập nhật trong app"): the app reads releases/latest/download/metatools-update.json of
# THIS (public) repo. The payload job below attaches the payload + manifest to the same release as the zips.
# Optional: vars.UPDATE_BASE_URL = another public folder for the payload links in the manifest.
env:
  PKG_IGNORE: --ignore=^/test --ignore=^/dist --ignore=^/scripts --ignore=^/\.github --ignore=TIEN_DO.md --ignore=preview_.*

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64, name: Windows-x64 }
          - { os: macos-latest, platform: darwin, arch: arm64, name: Mac-AppleChip }
          - { os: macos-latest, platform: darwin, arch: x64, name: Mac-Intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Git engine + updater tests
        if: runner.os != 'Windows'
        run: node test/git.test.js && node test/update.test.js
      - name: Package
        shell: bash
        # 2.5.0: app hiện tên "Tom Multitask" (exe/.app/zip). productName trong package.json vẫn MetaTools để dữ liệu
        # trên máy đã cài (userData), khoá mã hoá và bản cập nhật trong app giữ nguyên; payload/manifest giữ tên cũ vì bản cũ tìm đúng tên đó
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXTRA=()
          if [ "${{ matrix.platform }}" = "darwin" ]; then EXTRA=(--icon=assets/icon.icns --app-bundle-id=vn.metax.metatools); fi
          if [ "${{ matrix.platform }}" = "win32" ]; then EXTRA=(--icon=assets/icon.ico --win32metadata.CompanyName=MetaX "--win32metadata.ProductName=Tom Multitask" "--win32metadata.FileDescription=Tom Multitask"); fi
          npx @electron/packager . "Tom Multitask" --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out=dist --asar --overwrite --prune=true \
            $PKG_IGNORE --app-copyright=MetaX --app-version=$VERSION "${EXTRA[@]}"
      - name: Sign (macOS, ad-hoc until the company Developer ID is added)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "dist/Tom Multitask-darwin-${{ matrix.arch }}/Tom Multitask.app"
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "out/Tom Multitask"
          ditto "dist/Tom Multitask-darwin-${{ matrix.arch }}/Tom Multitask.app" "out/Tom Multitask/Tom Multitask.app"
          cp HUONG_DAN.md "out/Tom Multitask/"
          cd out && ditto -c -k --sequesterRsrc --keepParent "Tom Multitask" "../TomMultitask-${{ matrix.name }}.zip"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "dist/Tom Multitask-win32-x64" "out/Tom Multitask"
          Copy-Item HUONG_DAN.md "out/Tom Multitask/"
          Compress-Archive -Path "out/Tom Multitask" -DestinationPath "TomMultitask-${{ matrix.name }}.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: TomMultitask-${{ matrix.name }}
          path: TomMultitask-${{ matrix.name }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TomMultitask-${{ matrix.name }}.zip
          name: Tom Multitask ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md

  # app payload for the in-app updater: the same app.asar the installers carry (pure JS, one file for every platform)
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test/update.test.js
      - name: Payload + manifest
        shell: bash
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx @electron/packager . MetaTools --platform=linux --arch=x64 --out=dist --asar --overwrite --prune=true $PKG_IGNORE --app-version=$VERSION
          cp dist/MetaTools-linux-x64/resources/app.asar "MetaTools-payload-$VERSION.asar"
          TAG="${GITHUB_REF_NAME}"
          # payload link = this tag's release asset (the token fallback for a private repo matches it by file name)
          if [ -n "$UPDATE_BASE_URL" ]; then BASE="$UPDATE_BASE_URL"; else BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"; fi
          node scripts/make-update-manifest.js --payload "MetaTools-payload-$VERSION.asar" --base-url "$BASE" --out metatools-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: MetaTools-update
          path: |
            MetaTools-payload-*.asar
            metatools-update.json
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MetaTools-payload-*.asar
            metatools-update.json
          name: Tom Multitask ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md

