name: Build & Release MetaTools

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64, name: Windows-x64 }
          - { os: macos-latest, platform: darwin, arch: arm64, name: Mac-AppleChip }
          - { os: macos-latest, platform: darwin, arch: x64, name: Mac-Intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Git engine tests
        if: runner.os != 'Windows'
        run: node test/git.test.js
      - name: Package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXTRA=""
          if [ "${{ matrix.platform }}" = "darwin" ]; then EXTRA="--icon=assets/icon.icns --app-bundle-id=vn.metax.metatools"; fi
          if [ "${{ matrix.platform }}" = "win32" ]; then EXTRA="--icon=assets/icon.ico --win32metadata.CompanyName=MetaX --win32metadata.ProductName=MetaTools --win32metadata.FileDescription=MetaTools"; fi
          npx @electron/packager . MetaTools --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out=dist --asar --overwrite --prune=true \
            --ignore='^/test' --ignore='^/dist' --ignore='^/\.github' --ignore='TIEN_DO.md' --ignore='preview_.*' \
            --app-copyright=MetaX --app-version=$VERSION $EXTRA
      - name: Sign (macOS, ad-hoc until the company Developer ID is added)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "dist/MetaTools-darwin-${{ matrix.arch }}/MetaTools.app"
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out/MetaTools
          ditto "dist/MetaTools-darwin-${{ matrix.arch }}/MetaTools.app" out/MetaTools/MetaTools.app
          cp HUONG_DAN.md out/MetaTools/
          cd out && ditto -c -k --sequesterRsrc --keepParent MetaTools "../MetaTools-${{ matrix.name }}.zip"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "dist/MetaTools-win32-x64" out/MetaTools
          Copy-Item HUONG_DAN.md out/MetaTools/
          Compress-Archive -Path out/MetaTools -DestinationPath "MetaTools-${{ matrix.name }}.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: MetaTools-${{ matrix.name }}
          path: MetaTools-${{ matrix.name }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MetaTools-${{ matrix.name }}.zip
          name: MetaTools ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
